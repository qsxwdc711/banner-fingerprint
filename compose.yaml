name: banner-fingerprint

services:
  server:
    build:
      context: .
      target: server
    command: ["--listen", ":8080", "--rules", "/rules/fingerprints.json"]
    volumes:
      - ./rules/fingerprints.json:/rules/fingerprints.json:ro
    ports:
      - "127.0.0.1:${BANNER_PORT:-8080}:8080"
    networks: [fingerprint]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/server", "--healthcheck", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  client:
    build:
      context: .
      target: client
    command: ["--input", "/data/banners.json", "--server", "http://server:8080", "--timeout", "30s"]
    volumes:
      - ./samples/banners.json:/data/banners.json:ro
    depends_on:
      server:
        condition: service_healthy
    networks: [fingerprint]
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    restart: "no"

networks:
  fingerprint:
    internal: true
