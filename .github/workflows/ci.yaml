name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Unit and integration tests, with race detection
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Compose syntax and container integration
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait server
          docker compose run --rm client > /tmp/results.json
          python3 - <<'PY'
          import json
          with open('/tmp/results.json', encoding='utf-8') as f:
              results = json.load(f)
          assert len(results) == 20, results
          assert results[0]['product'] == 'OpenSSH', results[0]
          assert results[3]['protocol'] == 'MySQL', results[3]
          assert results[-1]['protocol'] == 'unknown', results[-1]
          assert all(0 <= result['confidence'] <= 1 for result in results)
          PY
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          docker compose down
